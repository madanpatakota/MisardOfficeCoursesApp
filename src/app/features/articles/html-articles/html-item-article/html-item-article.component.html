<ng-container *ngIf="item as article">
    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ article.TopicName }}</h5>
                <p class="card-text">{{ article.Description }}</p>
                <div class="mt-4">
                    <div *ngFor="let imageUrl of article.ImageUrls">
                        <img [src]="imageUrl" alt="Student Registration Form Preview" style="max-width: 100%; height: auto;" />
                    </div>
                </div>
                <div class="mt-4">
                    <pre><code class="language-html">{{ article.Content }}</code></pre>
                </div>
                <footer class="mt-4">
                    <p class="text-muted">Created by: {{ article.CreatedBy }}</p>
                    <p class="text-muted">Created on: {{ article.CreatedDate }}</p>
                </footer>
            </div>
        </div>
    </div>
</ng-container>
